# Install cloudflared as a system service separately.
# The existing camera fallback keeps its browser surface outside this ingress.
# The remote app requests the surface source with `?src=atas`.
# cloudflared path matching does not inspect query strings, so path routing cannot
# enforce `src=atas` against a caller. Strict source isolation would require a
# separate explicitly scoped proxy/Go2RTC configuration and is outside this implementation.
# Cloudflare Tunnel is transport/TLS only; it provides no application authentication.
tunnel: replace-with-tunnel-id
credentials-file: /etc/cloudflared/replace-with-tunnel-id.json

ingress:
  - hostname: camera.example.com
    path: ^/ws/vision/.*$
    service: http://127.0.0.1:8080
  - hostname: camera.example.com
    path: ^/stream\.mjpg$
    service: http://127.0.0.1:8080
  # Approved remote control/video ingress; all other HTTP routes stay blocked.
  - hostname: remote.monitor-kapal-pora-pora.web.id
    path: ^/api/control/esc-prime$
    service: http://127.0.0.1:8080
  - hostname: remote.monitor-kapal-pora-pora.web.id
    path: ^/ws/control/[^/]+$
    service: http://127.0.0.1:8080
  - hostname: remote.monitor-kapal-pora-pora.web.id
    path: ^/api/ws$
    service: http://127.0.0.1:1984
  - hostname: remote.monitor-kapal-pora-pora.web.id
    path: ^/api/webrtc$
    service: http://127.0.0.1:1984
  - hostname: remote.monitor-kapal-pora-pora.web.id
    path: ^/api/stream\.mp4$
    service: http://127.0.0.1:1984
  - hostname: remote.monitor-kapal-pora-pora.web.id
    path: ^/api/stream\.mjpeg$
    service: http://127.0.0.1:1984
  - hostname: remote.monitor-kapal-pora-pora.web.id
    path: ^/.*$
    service: http_status:404

  # Global fallback for all other hostnames.
  - service: http_status:404
